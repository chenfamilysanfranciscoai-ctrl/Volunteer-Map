<style>
:root{
  --moss: #4a7856;
  --moss-dark: #24402c;
  --moss-light: #eef4ee;
  --clay: #d9642b;
  --clay-dark: #b8531f;
  --ink: #1f2b23;
  --paper: #fbfaf7;
  --line: #e4e0d6;
}
*{ box-sizing: border-box; }
html, body{
  margin: 0;
  min-height: 100%;
  font-family: 'Inter', system-ui, sans-serif;
  background: var(--paper);
  color: var(--ink);
}
header{
  background: var(--paper);
  border-bottom: 1px solid var(--line);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 12px;
}
.brand{
  display: flex;
  align-items: center;
  gap: 10px;
}
.brand-icon{
  width: 34px;
  height: 34px;
  border-radius: 9px;
  background: var(--moss);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
}
header h1{
  margin: 0;
  font-size: 1.05rem;
  font-weight: 700;
  color: var(--moss-dark);
  letter-spacing: -0.01em;
}
header p{
  margin: 0;
  font-size: 0.78rem;
  color: #8a8577;
}

/* ---- tab navigation (shared across every page on the site) ---- */
nav.tabs{
  display: flex;
  gap: 4px;
  flex-wrap: wrap;
}
.tab-link{
  text-decoration: none;
  color: #6b6656;
  font-size: 0.85rem;
  font-weight: 600;
  padding: 8px 14px;
  border-radius: 8px;
  transition: background 0.15s ease, color 0.15s ease;
}
.tab-link:hover{
  background: var(--moss-light);
  color: var(--moss-dark);
}
.tab-link.active{
  background: var(--moss);
  color: white;
}

.placeholder-wrap{
  min-height: calc(100vh - 68px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 40px 24px;
}
.placeholder-card{
  max-width: 440px;
  text-align: center;
  background: white;
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 44px 36px;
}
.placeholder-icon{
  width: 54px;
  height: 54px;
  border-radius: 14px;
  background: var(--moss-light);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 26px;
  margin: 0 auto 20px;
}
.placeholder-card h2{
  margin: 0 0 10px;
  font-size: 1.3rem;
  font-weight: 800;
  color: var(--moss-dark);
}
.placeholder-card p{
  margin: 0;
  font-size: 0.92rem;
  color: #6b6656;
  line-height: 1.55;
}
.placeholder-tag{
  display: inline-block;
  margin-top: 18px;
  font-size: 0.68rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.07em;
  color: var(--clay-dark);
  background: #fbe9dd;
  padding: 5px 12px;
  border-radius: 999px;
}
</style>
</head>
