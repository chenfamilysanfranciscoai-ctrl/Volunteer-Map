name: Update volunteer events

on:
  schedule:
    # 15:00 UTC = 8:00 AM Pacific Daylight Time (adjust if you care about the
    # 1-hour PST/PDT drift -- GitHub cron always runs in UTC).
    - cron: "0 15 * * 1"
  workflow_dispatch: {}  # lets you trigger a run manually from the Actions tab

permissions:
  contents: write

jobs:
  update-events:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run event updater
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python scripts/update_events.py

      - name: Commit and push events.json if it changed
        run: |
          if git diff --quiet -- events.json; then
            echo "No changes to events.json"
            exit 0
          fi
          git config user.name "volunteer-map-bot"
          git config user.email "actions@users.noreply.github.com"
          git add events.json
          git commit -m "Auto-update volunteer events [skip ci]"
          git push
